      <h1>Solid, liquid, gas</h1>
      <p class="hint">Everything is made of tiny particles that never stop jiggling, and that gently pull on their neighbours. Heat them up and watch the jiggling win: the solid melts into a liquid, and the liquid boils into a gas. Cool them down and watch it all happen backwards.</p>

      <div class="readouts" id="readouts"></div>
