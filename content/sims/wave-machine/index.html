<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wave machine</title>
    <link rel="stylesheet" href="../lib/sim.css" />
  </head>
  <body>
    <main class="sim">
      <h1>Wave machine</h1>
      <p class="hint">Shake one end and a wave runs along. Watch the red bead: does it travel with the wave, or stay where it is? Change the frequency and speed and measure the wavelength, or send two pulses at each other and see what happens when they meet.</p>
      <div class="stage" id="stage"></div>
      <div class="readouts" id="readouts"></div>
      <div class="controls" id="controls"></div>
      <div class="buttons" id="buttons"></div>
    </main>
    <script src="../lib/p5.min.js"></script>
    <script src="../lib/sim-kit.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
