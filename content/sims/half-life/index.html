<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Half-life</title>
    <link rel="stylesheet" href="../lib/sim.css" />
  </head>
  <body>
    <main class="sim">
      <h1>Half-life</h1>
      <p class="hint">Each of these 400 atoms is unstable: at some random moment it will decay. Nobody can say when any one atom will go, but the whole crowd is amazingly predictable. Press Start, or flip a coin for every atom, and watch the graph.</p>
      <div class="stage" id="stage"></div>
      <div class="readouts" id="readouts"></div>
      <div class="controls" id="controls"></div>
      <div class="buttons" id="buttons"></div>
    </main>
    <script src="../lib/p5.min.js"></script>
    <script src="../lib/sim-kit.js"></script>
    <script src="sketch.js"></script>
